<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ghazely</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <style>body { width: 280px; padding: 14px; } dl { margin: 10px 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; } dt { color: #8a8a8a; } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; } .health { display: flex; flex: 0 1 auto; gap: 3px; height: 16px; min-width: 0; padding: 2px; background: #111; border: 1px solid #2a2a2a; border-radius: 4px; } .health[hidden] { display: none; } .health i { flex: 0 1 24px; width: 24px; min-width: 6px; border-radius: 2px; background: #2a1818; transition: background 0.3s; } .health i.on { background: linear-gradient(#b02a2a, #7a1f1f); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }  .stage { margin-bottom: 18px; } .stage-name { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 2px; font-size: 16px; font-weight: 600; text-transform: capitalize; } #art svg { display: block; } .actions { display: flex; gap: 8px; margin-top: 14px; } .icon-btn { position: relative; flex: 1; height: 36px; padding: 0; display: grid; place-items: center; } .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; } .icon-btn[hidden] { display: none; } .icon-btn:disabled { opacity: 0.4; cursor: default; } .icon-btn[aria-pressed="true"] { border-color: #b02a2a; background: #2a1818; } .icon-btn::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 8px; background: #111; border: 1px solid #7a1f1f; border-radius: 4px; color: #e8e2d8; font-size: 12px; line-height: 1.3; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.12s; z-index: 10; } .icon-btn:hover::after, .icon-btn:focus-visible::after { opacity: 1; visibility: visible; } .icon-btn:first-child::after { left: 0; transform: none; } .icon-btn:last-child::after { left: auto; right: 0; transform: none; } .meter { margin: 10px 0; } .meter-head { display: flex; justify-content: space-between; margin-bottom: 4px; } .meter-head label { margin: 0; color: #8a8a8a; } .meter.inline { margin-top: 20px; } .inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; } #snoozeLabel { color: #8a8a8a; white-space: nowrap; } .meter-head span { font-variant-numeric: tabular-nums; } progress { display: block; width: 100%; height: 8px; border: 0; border-radius: 4px; background: #111; appearance: none; } progress::-webkit-progress-bar { background: #111; border: 1px solid #2a2a2a; border-radius: 4px; } progress::-webkit-progress-value { background: #7a1f1f; border-radius: 4px; transition: width 0.4s; } progress::-moz-progress-bar { background: #7a1f1f; border-radius: 4px; } #rest::-webkit-progress-value { background: #8a8a8a; } #rest::-moz-progress-bar { background: #8a8a8a; }</style>
</head>
<body>
  <div class="stage">
    <div id="art"></div>
    <div class="stage-name"><span id="stage">-</span><span id="badge" class="badge" hidden></span></div>
  </div>
  <div class="meter">
    <div class="meter-head"><label for="sat">Minutes sat</label><span id="minutes">-</span></div>
    <progress id="sat" max="1" value="0"></progress>
  </div>
  <div class="meter">
    <div class="meter-head"><label for="rest">Rest</label><span id="restText">-</span></div>
    <progress id="rest" max="1" value="0"></progress>
  </div>
  <div class="meter inline">
    <span id="snoozeLabel">Snoozes left today</span>
    <span id="snoozes" hidden>Off</span>
    <div id="snoozeBar" class="health" role="meter" aria-labelledby="snoozeLabel" aria-valuemin="0"></div>
  </div>
  <div class="actions">
    <button id="pause" type="button" class="icon-btn" data-tip="Pause 1 hour" aria-label="Pause 1 hour">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
    </button>
    <button id="resume" type="button" class="icon-btn" hidden data-tip="Resume" aria-label="Resume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" /></svg>
    </button>
    <button id="reset" type="button" class="icon-btn" data-tip="Reset clock" aria-label="Reset clock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
    </button>
    <button id="demo" type="button" class="icon-btn" data-tip="Demo mode" aria-label="Demo mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l9 6-9 6z" /><path d="M12 6l9 6-9 6z" /></svg>
    </button>
    <button id="options" type="button" class="icon-btn" data-tip="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
    </button>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
